<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShivAnimate — Bring Words to Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;
  --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;
  --radius-xl:1rem;--radius-2xl:1.5rem;--radius-full:9999px;
  --font-display:'Space Mono',monospace;
  --font-body:'Space Grotesk',system-ui,sans-serif;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
}
:root,[data-theme="light"]{
  --bg:#f0edf8;--surface:#f7f5fd;--surface-2:#ffffff;
  --surface-offset:#e8e3f5;--border:oklch(0.4 0.08 290/.15);
  --text:#1a1626;--text-muted:#6b6180;--text-faint:#b0a8c8;
  --primary:#7c3aed;--primary-hover:#6d28d9;
  --accent:#06b6d4;--accent-2:#f59e0b;
  --shadow-sm:0 1px 3px oklch(0.3 0.1 290/.08);
  --shadow-md:0 4px 16px oklch(0.3 0.1 290/.12);
  --shadow-lg:0 12px 40px oklch(0.3 0.1 290/.18);
}
[data-theme="dark"]{
  --bg:#0d0b14;--surface:#13101e;--surface-2:#1a1628;
  --surface-offset:#211c33;--border:oklch(0.8 0.05 290/.12);
  --text:#e8e0f8;--text-muted:#9b91b8;--text-faint:#504870;
  --primary:#a78bfa;--primary-hover:#8b5cf6;
  --accent:#22d3ee;--accent-2:#fbbf24;
  --shadow-sm:0 1px 3px oklch(0 0 0/.3);
  --shadow-md:0 4px 16px oklch(0 0 0/.4);
  --shadow-lg:0 12px 40px oklch(0 0 0/.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);color:var(--text);background:var(--bg);transition:background var(--transition),color var(--transition);}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit;}
input{font:inherit;color:inherit;}
a{color:inherit;}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;opacity:.25;}
.orb-1{width:400px;height:400px;top:-100px;right:-50px;background:var(--primary);}
.orb-2{width:300px;height:300px;bottom:-80px;left:-60px;background:var(--accent);opacity:.15;}
.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;}
nav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-4) var(--space-6);
  background:oklch(from var(--bg) l c h/.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.nav-logo{
  display:flex;align-items:center;gap:var(--space-2);
  font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;
  letter-spacing:-.02em;
}
.nav-logo span.purple{color:var(--primary);}
.nav-logo span.cyan{color:var(--accent);}
.btn-icon{
  width:36px;height:36px;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);border:1px solid var(--border);
  background:var(--surface);transition:all var(--transition);
}
.btn-icon:hover{color:var(--text);background:var(--surface-offset);}
/* VIEWS */
.view{display:none;}
.view.active{display:flex;}
/* ANIMATE VIEW */
#view-animate{
  flex:1;flex-direction:column;align-items:center;
  padding:var(--space-8) var(--space-4) var(--space-16);
}
.animate-hero{text-align:center;max-width:600px;margin-bottom:var(--space-10);}
.animate-hero h1{font-size:var(--text-2xl);font-weight:700;line-height:1.1;margin-bottom:var(--space-3);}
.animate-hero p{color:var(--text-muted);font-size:var(--text-lg);}
.word-input-card{
  width:100%;max-width:540px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-2xl);
  padding:var(--space-6);box-shadow:var(--shadow-md);margin-bottom:var(--space-8);
}
.word-input-row{display:flex;gap:var(--space-3);align-items:stretch;}
.word-field{flex:1;position:relative;}
.word-field .form-input{
  width:100%;padding:var(--space-3) var(--space-4);
  border-radius:var(--radius-md);border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);outline:none;
  transition:all var(--transition);
  font-family:var(--font-display);font-size:var(--text-xl);
  text-align:center;letter-spacing:.1em;text-transform:uppercase;padding-right:60px;
}
.word-field .form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px oklch(from var(--primary) l c h/.2);}
.word-field .form-input::placeholder{color:var(--text-faint);}
.char-count{
  position:absolute;right:var(--space-3);top:50%;transform:translateY(-50%);
  font-size:var(--text-xs);color:var(--text-faint);font-family:var(--font-display);
}
.char-count.warning{color:var(--accent-2);}
.btn-animate{
  padding:var(--space-3) var(--space-6);border-radius:var(--radius-md);
  background:var(--primary);color:#fff;font-size:var(--text-base);
  font-weight:700;transition:all var(--transition);white-space:nowrap;
}
.btn-animate:hover{background:var(--primary-hover);transform:translateY(-1px);}
.style-row{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-4);}
.style-chip{
  padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);
  font-size:var(--text-xs);font-weight:600;border:1px solid var(--border);
  color:var(--text-muted);background:var(--surface-2);transition:all var(--transition);cursor:pointer;
}
.style-chip.active,.style-chip:hover{background:var(--primary);color:white;border-color:var(--primary);}
.stage-wrap{
  width:100%;max-width:700px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-2xl);overflow:hidden;box-shadow:var(--shadow-lg);
}
.stage-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-4) var(--space-5);
  border-bottom:1px solid var(--border);background:var(--surface-2);
}
.stage-title{font-size:var(--text-sm);font-weight:600;color:var(--text-muted);}
.stage-actions{display:flex;gap:var(--space-2);}
.stage{
  min-height:200px;display:flex;align-items:center;justify-content:center;
  padding:var(--space-10) var(--space-8);
  background:radial-gradient(ellipse at center,var(--surface-offset) 0%,var(--bg) 100%);
}
.stage-letters{display:flex;gap:.05em;align-items:center;justify-content:center;}
.letter{
  font-family:var(--font-display);font-size:clamp(3rem,10vw,6rem);
  font-weight:700;line-height:1;display:inline-block;
  opacity:0;transform:translateY(40px) scale(.8);
}
.stage-empty{font-size:var(--text-sm);color:var(--text-faint);text-align:center;font-family:var(--font-display);}
.share-bar{
  display:none;padding:var(--space-3) var(--space-5);
  border-top:1px solid var(--border);background:var(--surface);
  align-items:center;gap:var(--space-3);
}
.share-bar.show{display:flex;}
.share-url{
  flex:1;font-family:var(--font-display);font-size:var(--text-xs);
  color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--surface-offset);border-radius:var(--radius-sm);
  padding:var(--space-2) var(--space-3);border:1px solid var(--border);
}
.btn-copy{
  padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);
  background:var(--accent);color:#0c1820;font-size:var(--text-xs);
  font-weight:700;transition:all var(--transition);white-space:nowrap;cursor:pointer;
}
.btn-copy:hover{opacity:.85;}
.btn-copy.copied{background:#4ade80;}
/* PUBLIC VIEW */
#view-public{
  flex:1;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--space-8) var(--space-4);
}
.public-stage{width:100%;max-width:800px;text-align:center;}
.public-label{
  font-size:var(--text-xs);color:var(--text-faint);
  font-family:var(--font-display);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:var(--space-6);
}
.public-big-letters{
  display:flex;align-items:center;justify-content:center;
  gap:.04em;flex-wrap:wrap;margin-bottom:var(--space-8);
}
.public-letter{
  font-family:var(--font-display);font-size:clamp(5rem,18vw,12rem);
  font-weight:700;line-height:1;display:inline-block;opacity:0;
}
.public-try{margin-top:var(--space-8);font-size:var(--text-sm);color:var(--text-muted);}
.public-try a{color:var(--primary);text-decoration:none;font-weight:600;}
.public-try a:hover{text-decoration:underline;}
/* ANIMATIONS */
@keyframes popIn{
  0%{opacity:0;transform:translateY(40px) scale(.6);}
  60%{opacity:1;transform:translateY(-8px) scale(1.05);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes waveIn{
  0%{opacity:0;transform:translateY(0) rotate(-15deg) scale(.5);}
  60%{opacity:1;transform:translateY(-15px) rotate(5deg) scale(1.1);}
  100%{opacity:1;transform:translateY(0) rotate(0deg) scale(1);}
}
@keyframes glitch1{
  0%{transform:translate(0);opacity:0;}
  10%{transform:translate(-4px,2px);opacity:1;}
  20%{transform:translate(4px,-2px);opacity:1;}
  30%{transform:translate(-2px,4px);opacity:1;}
  40%{transform:translate(0);opacity:1;}
  100%{transform:translate(0);opacity:1;}
}
@keyframes fireIn{
  0%{opacity:0;transform:scaleY(.1) scaleX(1.4);filter:blur(4px);}
  50%{opacity:1;transform:scaleY(1.15) scaleX(.9);filter:blur(0);}
  70%{transform:scaleY(.95) scaleX(1.05);}
  100%{opacity:1;transform:scale(1);}
}
@keyframes neonPulse{
  0%,100%{text-shadow:0 0 8px currentColor,0 0 20px currentColor;}
  50%{text-shadow:0 0 16px currentColor,0 0 40px currentColor,0 0 60px currentColor;}
}
@keyframes spin3d{
  0%{opacity:0;transform:perspective(400px) rotateY(90deg);}
  60%{opacity:1;transform:perspective(400px) rotateY(-10deg);}
  100%{opacity:1;transform:perspective(400px) rotateY(0deg);}
}
@keyframes rainbowColor{
  0%{color:#f87171;}16%{color:#fb923c;}33%{color:#facc15;}
  50%{color:#4ade80;}66%{color:#60a5fa;}83%{color:#c084fc;}100%{color:#f87171;}
}
.anim-pop .letter-done{animation:neonPulse 2s ease-in-out infinite;}
.anim-rainbow .letter-done{animation:rainbowColor 2s linear infinite;}
/* TOAST */
.toast{
  position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-full);
  padding:var(--space-2) var(--space-6);font-size:var(--text-sm);font-weight:500;
  box-shadow:var(--shadow-md);z-index:999;opacity:0;transition:all .3s ease;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:600px){
  nav{padding:var(--space-3) var(--space-4);}
  .word-input-row{flex-direction:column;}
  .stage{padding:var(--space-8) var(--space-4);}
}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="app">

<nav>
  <div class="nav-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="ShivAnimate">
      <rect x="2" y="2" width="10" height="10" rx="2" fill="var(--primary)" opacity=".9"/>
      <rect x="16" y="2" width="10" height="10" rx="2" fill="var(--accent)" opacity=".9"/>
      <rect x="2" y="16" width="10" height="10" rx="2" fill="var(--accent)" opacity=".7"/>
      <rect x="16" y="16" width="10" height="10" rx="2" fill="var(--primary)" opacity=".7"/>
      <circle cx="14" cy="14" r="3" fill="white" opacity=".9"/>
    </svg>
    <span><span class="purple">Shiv</span><span class="cyan">Animate</span></span>
  </div>
  <button class="btn-icon" data-theme-toggle aria-label="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</nav>

<!-- ANIMATE VIEW -->
<div id="view-animate" class="view active">
  <div class="animate-hero">
    <h1>Type a word.<br>Watch it come alive.</h1>
    <p>Up to 9 characters — then share the magic ✦</p>
  </div>
  <div class="word-input-card">
    <div class="word-input-row">
      <div class="word-field">
        <input id="word-input" class="form-input" type="text" maxlength="9"
          placeholder="HELLO" oninput="onWordInput()" onkeydown="onWordKeydown(event)"
          autocomplete="off" spellcheck="false">
        <span class="char-count" id="char-count">0/9</span>
      </div>
      <button class="btn-animate" onclick="animateWord()">✦ Animate</button>
    </div>
    <div class="style-row">
      <span class="style-chip active" onclick="selectStyle(this,'pop')">✦ Pop</span>
      <span class="style-chip" onclick="selectStyle(this,'wave')">〰 Wave</span>
      <span class="style-chip" onclick="selectStyle(this,'glitch')">⚡ Glitch</span>
      <span class="style-chip" onclick="selectStyle(this,'fire')">🔥 Fire</span>
      <span class="style-chip" onclick="selectStyle(this,'spin')">↻ Spin</span>
      <span class="style-chip" onclick="selectStyle(this,'rainbow')">🌈 Rainbow</span>
    </div>
  </div>
  <div class="stage-wrap">
    <div class="stage-header">
      <span class="stage-title" id="stage-label">Preview</span>
      <div class="stage-actions">
        <button class="btn-icon" onclick="replayAnimation()" title="Replay">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
        </button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="stage-empty" id="stage-empty">Type a word above ↑</div>
      <div class="stage-letters" id="stage-letters"></div>
    </div>
    <div class="share-bar" id="share-bar">
      <span class="share-url" id="share-url-text"></span>
      <button class="btn-copy" id="btn-copy" onclick="copyShareUrl()">Copy link</button>
    </div>
  </div>
</div>

<!-- PUBLIC VIEW -->
<div id="view-public" class="view">
  <div class="public-stage">
    <div class="public-label">✦ ShivAnimate — Someone shared this with you</div>
    <div class="public-big-letters" id="public-letters"></div>
    <div class="public-try">
      Animate your own word — <a href="#" onclick="goHome(event)">Try ShivAnimate →</a>
    </div>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
let currentWord='',currentStyle='pop';
const COLORS=['var(--primary)','var(--accent)','#f87171','#fb923c','#facc15','#4ade80','#60a5fa','#c084fc','#f472b6'];
const ANIMS={
  pop:    (el,i)=>{el.style.animation=`popIn .5s cubic-bezier(.34,1.56,.64,1) ${i*80}ms both`;},
  wave:   (el,i)=>{el.style.animation=`waveIn .6s cubic-bezier(.34,1.56,.64,1) ${i*100}ms both`;},
  glitch: (el,i)=>{el.style.animation=`glitch1 .7s ease ${i*60}ms both`;},
  fire:   (el,i)=>{el.style.animation=`fireIn .5s ease-out ${i*70}ms both`;},
  spin:   (el,i)=>{el.style.animation=`spin3d .6s ease ${i*90}ms both`;},
  rainbow:(el,i)=>{el.style.animation=`popIn .5s cubic-bezier(.34,1.56,.64,1) ${i*80}ms both`;}
};

// Theme toggle
(function(){
  const btn=document.querySelector('[data-theme-toggle]'),html=document.documentElement;
  let dark=true;
  if(btn)btn.addEventListener('click',()=>{
    dark=!dark;
    html.setAttribute('data-theme',dark?'dark':'light');
    btn.innerHTML=dark
      ?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
      :'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  });
})();

// On load: check for shared link
(function(){
  const hash=window.location.hash;
  if(hash.startsWith('#animate/')){
    const p=hash.split('/');
    const word=(p[1]||'').toUpperCase().slice(0,9);
    const style=p[2]||'pop';
    if(word){showPublicView(word,style);return;}
  }
  showView('animate');
})();

function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
}

function onWordInput(){
  const input=document.getElementById('word-input');
  const val=input.value.replace(/[^a-zA-Z0-9]/g,'').slice(0,9);
  input.value=val;
  const count=document.getElementById('char-count');
  count.textContent=val.length+'/9';
  count.className='char-count'+(val.length>=9?' warning':'');
}

function onWordKeydown(e){if(e.key==='Enter')animateWord();}

function selectStyle(el,style){
  document.querySelectorAll('.style-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');currentStyle=style;
  if(currentWord)animateWord();
}

function animateWord(){
  const input=document.getElementById('word-input');
  const word=input.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,9);
  if(!word){showToast('Type a word first!');return;}
  currentWord=word;
  const lettersEl=document.getElementById('stage-letters');
  document.getElementById('stage-empty').style.display='none';
  lettersEl.innerHTML='';
  lettersEl.className='stage-letters anim-'+currentStyle;
  word.split('').forEach((char,i)=>{
    const span=document.createElement('span');
    span.className='letter';
    span.textContent=char;
    span.style.color=COLORS[i%COLORS.length];
    lettersEl.appendChild(span);
    requestAnimationFrame(()=>(ANIMS[currentStyle]||ANIMS.pop)(span,i));
    setTimeout(()=>span.classList.add('letter-done'),i*100+700);
  });
  document.getElementById('stage-label').textContent=word+' • '+currentStyle;
  const shareUrl=window.location.origin+window.location.pathname+'#animate/'+word+'/'+currentStyle;
  document.getElementById('share-url-text').textContent=shareUrl;
  document.getElementById('share-bar').classList.add('show');
  history.replaceState(null,'','#animate/'+word+'/'+currentStyle);
}

function replayAnimation(){
  if(currentWord){document.getElementById('word-input').value=currentWord;animateWord();}
}

function copyShareUrl(){
  const url=document.getElementById('share-url-text').textContent;
  navigator.clipboard.writeText(url).then(()=>{
    const btn=document.getElementById('btn-copy');
    btn.textContent='✓ Copied!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy link';btn.classList.remove('copied');},2500);
    showToast('Link copied! Share it with anyone ✦');
  }).catch(()=>showToast('Select the link and copy manually'));
}

function showPublicView(word,style){
  showView('public');
  const container=document.getElementById('public-letters');
  container.className='public-big-letters anim-'+(style||'pop');
  container.innerHTML='';
  word.split('').forEach((char,i)=>{
    const span=document.createElement('span');
    span.className='public-letter';
    span.textContent=char;
    span.style.color=COLORS[i%COLORS.length];
    container.appendChild(span);
    requestAnimationFrame(()=>(ANIMS[style]||ANIMS.pop)(span,i));
    setTimeout(()=>span.classList.add('letter-done'),i*100+800);
  });
}

function goHome(e){
  e.preventDefault();
  history.replaceState(null,'',window.location.pathname);
  showView('animate');
  document.getElementById('stage-letters').innerHTML='';
  document.getElementById('stage-empty').style.display='';
  document.getElementById('share-bar').classList.remove('show');
  document.getElementById('word-input').value='';
  document.getElementById('char-count').textContent='0/9';
  currentWord='';
}

function showToast(msg){
  const toast=document.getElementById('toast');
  toast.textContent=msg;toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3000);
}
</script>
</body>
</html>
